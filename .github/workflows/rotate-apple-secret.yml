name: Rotate Sign in with Apple secret

# Web "Continue with Apple" signs in through Supabase, which authenticates to
# Apple with a client secret: a JWT signed by our Sign in with Apple key. Apple
# rejects any such JWT older than 6 months, so it has to be regenerated and
# pushed to Supabase on a schedule. Native iOS sign-in does not use it.
#
# Runs monthly and mints a fresh 180-day secret each time, so there are ~5
# months of slack: a few failed runs in a row still leave a working secret.
# A failed run emails the repository owner (GitHub's default for scheduled
# workflows), which is the cue to look.
#
# Each run:
#   1. Builds the JWT with apps/web/scripts/apple-client-secret.mjs (the key is
#      passed in an environment variable, never written to disk).
#   2. Writes it to the project's auth config via the Supabase Management API
#      (PATCH /v1/projects/{ref}/config/auth, field external_apple_secret).
#
# Apple offers no way to test a client secret without a real sign-in (its token
# endpoint rejects a dummy code before it looks at the secret), so a wrong
# key id, team or Services ID is NOT caught here. After the first run, and after
# changing any of those secrets, try "Continue with Apple" on the site.
#
# This repository is public: the secret is masked and never echoed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_P8                  Full contents of AuthKey_<KEY_ID>.p8, including
#                             the BEGIN/END lines
#   APPLE_KEY_ID              The key's id, e.g. Q236JUR9VR
#   APPLE_TEAM_ID             Apple Developer team id, e.g. J7Y8NYZ48Q
#   APPLE_SERVICES_ID         The web Services ID, e.g. com.gracechords.web
#   SUPABASE_ACCESS_TOKEN     Supabase access token (Account -> Access Tokens),
#                             scoped to the minimum: Resource access = Project
#                             (this project only); Permissions = No access
#                             except Application services -> Auth: Write. Add
#                             Project: Read only if the run fails with HTTP 403.
#   SUPABASE_PROJECT_REF      The <ref> in https://<ref>.supabase.co
#
# Run it by hand once after adding the secrets (Actions -> this workflow ->
# Run workflow), and again whenever the Apple key or Services ID changes.

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotate-apple-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPLE_P8: ${{ secrets.APPLE_P8 }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets are configured
        run: |
          for v in APPLE_P8 APPLE_KEY_ID APPLE_TEAM_ID APPLE_SERVICES_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done

      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/web/scripts/apple-client-secret.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One step, so the secret lives only in this shell: it is never passed
      # through step outputs or written to disk.
      - name: Generate the secret and update Supabase
        run: |
          set -euo pipefail

          CLIENT_SECRET=$(node apps/web/scripts/apple-client-secret.mjs \
            --team "$APPLE_TEAM_ID" --key-id "$APPLE_KEY_ID" --services-id "$APPLE_SERVICES_ID")
          echo "::add-mask::$CLIENT_SECRET"

          BODY=$(jq -n --arg s "$CLIENT_SECRET" '{external_apple_secret: $s}')
          OUT=$(mktemp)
          STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          if [ "$STATUS" != "200" ]; then
            # Only the error fields: a success body echoes the whole auth config.
            echo "::error::Supabase returned HTTP $STATUS: $(jq -c '{message, error, code}' "$OUT" 2>/dev/null || echo 'unreadable body')"
            rm -f "$OUT"
            exit 1
          fi
          rm -f "$OUT"
          echo "Supabase updated. The new secret is valid for 180 days."
