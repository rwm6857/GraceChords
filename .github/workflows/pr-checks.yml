name: PR Checks

# Run lint + tests + Vite build on every PR. All steps are non-blocking
# (`continue-on-error: true`) so the job always ends green — they're for
# visibility, not gating. Flip individual steps to required after their
# warning baselines have been driven down.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint (warn-only)
        continue-on-error: true
        run: npm run lint

      - name: Tests (warn-only)
        continue-on-error: true
        # Suite is green (157/157); any failure is a real regression. Root
        # script delegates to the @gracechords/web workspace.
        run: npm run test:run

      - name: Build (warn-only, vite only)
        continue-on-error: true
        # Skip the SEO/sitemap scripts that need a real Supabase service-role
        # key — only the bundle compile matters for a PR check. Run from the web
        # workspace so Vite finds apps/web/vite.config.js + index.html.
        working-directory: apps/web
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npx vite build

  # apps/studio consumes packages/tokens as a *committed* Swift mirror (an Xcode
  # build cannot run node), so the only thing keeping it honest is regenerating
  # and comparing. Separate job because it needs Node 22.18+ for TypeScript type
  # stripping, and bumping the job above would change what the web checks run on.
  #
  # Warn-only to match this file's convention, but unlike lint/test this check is
  # deterministic and starts green — it is a good candidate to make required.
  token-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Design tokens match their generated Swift (warn-only)
        continue-on-error: true
        # Invoked directly rather than through `npm run tokens:swift:check` so it
        # needs no install step — the generator has no dependencies and reads
        # native.ts directly.
        run: node packages/tokens/generate-swift.mjs --check
